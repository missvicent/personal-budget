<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Personal Budget Logo - P. -->
  <!-- Copyright: For use by Personal Budget -->
  
  <title>Personal Budget Logo</title>
  <desc>A minimalist logo featuring a stylized letter P with a period, representing Personal Budget</desc>
  
  <defs>
    <!-- Primary Brand Color -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Solid Brand Color -->
    <color id="brandColor">#6366f1</color>
  </defs>
  
  <!-- Logo Group - Easy to transform or reposition -->
  <g id="personal-budget-logo">
    <!-- The P -->
    <path d="M 50 150 L 50 50 L 110 50 Q 150 50 150 80 Q 150 110 110 110 L 50 110" 
          stroke="#6366f1" 
          stroke-width="8" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- The Period -->
    <circle cx="150" cy="150" r="8" fill="#6366f1"/>
  </g>
</svg>