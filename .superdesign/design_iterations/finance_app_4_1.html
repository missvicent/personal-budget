<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Minimalist Finance - Sign In</title>
    <link rel="stylesheet" href="finance_theme.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-sans);
        }
        
        body {
            background-color: var(--primary);
            color: var(--primary-foreground);
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        @media (min-width: 768px) {
            body {
                font-size: 18px;
                background: linear-gradient(135deg, var(--primary) 0%, #000000 100%);
                justify-content: center;
                align-items: center;
                padding: 2rem;
            }
        }
        
        .signin-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        
        @media (min-width: 768px) {
            .signin-container {
                padding: 3rem 2rem;
                box-shadow: var(--shadow-lg);
                border-radius: var(--radius-lg);
                background-color: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                margin-top: 2rem;
                margin-bottom: 2rem;
            }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background-color: var(--accent);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        
        .app-name {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .app-tagline {
            font-size: 1rem;
            opacity: 0.7;
        }
        
        .google-signin-button {
            width: 100%;
            padding: 1rem;
            background-color: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: var(--radius);
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: var(--shadow);
        }
        
        .google-signin-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .google-signin-button:active {
            transform: translateY(0);
        }
        
        .google-icon {
            width: 20px;
            height: 20px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.875rem;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .divider::before {
            margin-right: 1rem;
        }
        
        .divider::after {
            margin-left: 1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: var(--radius);
            color: var(--primary-foreground);
            transition: border-color 0.2s, background-color 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .password-input-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--primary-foreground);
            opacity: 0.7;
            cursor: pointer;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
        }
        
        .checkbox {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 0.5rem;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .checkbox.checked {
            background-color: var(--accent);
        }
        
        .forgot-password {
            color: var(--primary-foreground);
            opacity: 0.8;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        
        .forgot-password:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .signin-button {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent);
            color: var(--accent-foreground);
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .signin-button:hover {
            transform: translateY(-2px);
        }
        
        .signin-button:active {
            transform: translateY(0);
        }
        
        .signup-prompt {
            text-align: center;
            font-size: 0.875rem;
            margin-top: 2rem;
        }
        
        .signup-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        
        .signup-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        .privacy-notice {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 1rem;
            line-height: 1.4;
        }
        
        .privacy-notice a {
            color: var(--accent);
            text-decoration: none;
        }
        
        .privacy-notice a:hover {
            text-decoration: underline;
        }
        
        /* Animation classes */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="signin-container">
        <!-- Logo and App Name -->
        <div class="logo-container animate-in">
            <div class="logo">
                <i data-lucide="wallet" width="40" height="40"></i>
            </div>
            <h1 class="app-name">Finance</h1>
            <p class="app-tagline">Manage your money with confidence</p>
        </div>
        
        <!-- Google Sign In Button -->
        <button class="google-signin-button animate-in delay-100" id="google-signin">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>
        
        <div class="divider animate-in delay-200">or sign in with email</div>
        
        <!-- Email Sign In Form -->
        <form class="signin-form">
            <div class="form-group animate-in delay-300">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group animate-in delay-300">
                <label for="password" class="form-label">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle">
                        <i data-lucide="eye" width="20" height="20"></i>
                    </button>
                </div>
            </div>
            
            <div class="remember-forgot animate-in delay-400">
                <div class="remember-me">
                    <div class="checkbox" id="remember-checkbox">
                        <i data-lucide="check" width="14" height="14" style="display: none;"></i>
                    </div>
                    <label for="remember-checkbox">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="signin-button animate-in delay-400">
                Sign In
            </button>
        </form>
        
        <p class="signup-prompt animate-in delay-500">
            Don't have an account? <a href="#" class="signup-link">Sign up</a>
        </p>
        
        <p class="privacy-notice animate-in delay-500">
            By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </p>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Google Sign-In configuration
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // Replace with your actual client ID
                callback: handleCredentialResponse
            });
        };
        
        function handleCredentialResponse(response) {
            // Handle the Google Sign-In response
            console.log("Encoded JWT ID token: " + response.credential);
            
            // Decode the JWT token to get user information
            const responsePayload = decodeJwtResponse(response.credential);
            
            console.log("ID: " + responsePayload.sub);
            console.log('Full Name: ' + responsePayload.name);
            console.log('Given Name: ' + responsePayload.given_name);
            console.log('Family Name: ' + responsePayload.family_name);
            console.log("Image URL: " + responsePayload.picture);
            console.log("Email: " + responsePayload.email);
            
            // Here you would typically send the token to your backend
            // for verification and user authentication
            alert(`Welcome ${responsePayload.name}! Google Sign-In successful.`);
        }
        
        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
        
        // Google Sign-In button click handler
        document.getElementById('google-signin').addEventListener('click', function() {
            google.accounts.id.prompt((notification) => {
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    // Try alternative sign-in method
                    google.accounts.id.renderButton(
                        document.getElementById('google-signin'),
                        { 
                            theme: "outline", 
                            size: "large",
                            width: "100%"
                        }
                    );
                }
            });
        });
        
        // Toggle password visibility
        const passwordToggle = document.querySelector('.password-toggle');
        const passwordInput = document.getElementById('password');
        
        passwordToggle.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle icon
            const icon = this.querySelector('i');
            if (type === 'password') {
                icon.setAttribute('data-lucide', 'eye');
            } else {
                icon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        });
        
        // Toggle remember me checkbox
        const rememberCheckbox = document.getElementById('remember-checkbox');
        const checkIcon = rememberCheckbox.querySelector('i');
        
        rememberCheckbox.addEventListener('click', function() {
            this.classList.toggle('checked');
            if (this.classList.contains('checked')) {
                checkIcon.style.display = 'block';
            } else {
                checkIcon.style.display = 'none';
            }
        });
        
        // Form submission (prevent default for demo)
        const form = document.querySelector('.signin-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            // Add email sign-in logic here
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            console.log('Email sign-in attempted:', email);
            alert('Email sign-in functionality would be implemented here');
        });
        
        // Animation for elements
        document.addEventListener('DOMContentLoaded', function() {
            const animatedElements = document.querySelectorAll('.animate-in');
            animatedElements.forEach(element => {
                element.style.opacity = '0';
            });
            
            setTimeout(() => {
                animatedElements.forEach(element => {
                    element.style.opacity = '1';
                });
            }, 100);
        });
    </script>
</body>
</html>
